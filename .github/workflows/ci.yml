name: CI

# Every push and pull request: lint, the component tests, and the production
# build (typecheck + Vite). A push to main also deploys dist/ to the live
# channel of the default Firebase Hosting site of homematetz.
#
# Secret (Settings → Secrets and variables → Actions):
#   FIREBASE_SERVICE_ACCOUNT_HOMEMATETZ  service-account JSON, Firebase Hosting Admin

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  # Never cancel a deploy half-way through.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm test
      # The run number is stamped into the bundle and into dist/version.json;
      # open tabs compare the two to offer a reload after a deploy.
      - run: npm run build
        env:
          APP_BUILD_NUMBER: ${{ github.run_number }}

      - name: Deploy to Firebase Hosting
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_HOMEMATETZ }}
          projectId: homematetz
          channelId: live
